previews:
  generation: off

services:
  - type: web
    name: contentstash-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/backend/ms-playwright-browsers
      - key: SERVER_PLAYWRIGHT_ENABLED
        value: "true"
      - key: PLAYWRIGHT_MAX_CONCURRENCY
        value: "1"
      - key: PLAYWRIGHT_METADATA_FALLBACK_ENABLED
        value: "false"
      - key: PLAYWRIGHT_BLOCK_HEAVY_RESOURCES
        value: "true"
      - key: PLAYWRIGHT_BLOCK_IMAGES
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 34560000
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
